baseurl = "https://utsavdarlami.github.io/blogs/"
title = "felladog"
theme = "blank"
languageCode = "en"

# paginate = 20
pagerSize = 20

pygmentsCodeFences = true
pygmentsUseClasses = true

refLinksErrorLevel = "WARNING"
refLinksNotFoundURL =  "/blogs/404.html"
ignoreErrors = ["error-remote-getjson"]

# Raw markdown output format (view raw link)
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true

[outputs]
  page = ["HTML", "MARKDOWN"]




[Params]
title = "felladog blog"
subtitle = "felladog"
githubUrl = "https://github.com/utsavdarlami/"
homeUrl = "https://utsavdarlami.github.io/"
dlogUrl = "https://utsavdarlami.github.io/dlog/"
issueUrl = "https://github.com/utsavdarlami/blogs/issues/new"
author = "Utsav Darlami"
description = "felladog"
notoc = false 
mainsections = "posts"
